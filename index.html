<script src="./jscss/data.js"></script>
<script>
    (function () {
        var C = window.LOVE_CONFIG || {};
        if (C.boy) document.getElementById('nameBoy').textContent = C.boy;
        if (C.girl) document.getElementById('nameGirl').textContent = C.girl;
        if (C.wedding) document.getElementById('wedDate').textContent = C.wedding.replace(/-/g, ' . ');

        var els = document.querySelectorAll('.rise');
        requestAnimationFrame(function () {
            for (var i = 0; i < els.length; i++) {
                (function (el, d) { setTimeout(function () { el.classList.add('in'); }, d); })(els[i], 120 + i * 130);
            }
        });

        var audio = null;
        function play() {
            if (audio) return;
            audio = new Audio('./public/shangfen.mp3');
            audio.loop = true;
            var p = audio.play();
            if (p && p.catch) p.catch(function () { });
            try { sessionStorage.setItem('loveMusic', '1'); } catch (e) { }
        }

        document.getElementById('startBtn').addEventListener('click', function () {
            play();
            setTimeout(function () { location.href = 'index2.html'; }, 420);
        });
    })();
</script>
