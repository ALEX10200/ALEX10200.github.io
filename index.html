<script>
    (function () {
        var C = window.LOVE_CONFIG || {};
        if (C.boy) document.getElementById('nameBoy').textContent = C.boy;
        if (C.girl) document.getElementById('nameGirl').textContent = C.girl;
        if (C.nickname) document.getElementById('dediName').textContent = C.nickname;
        if (C.wedding) document.getElementById('wedDate').textContent = C.wedding.replace(/-/g, ' . ');

        var els = document.querySelectorAll('.rise');
        requestAnimationFrame(function () {
            for (var i = 0; i < els.length; i++) {
                (function (el, d) { setTimeout(function () { el.classList.add('in'); }, d); })(els[i], 120 + i * 130);
            }
        });

        document.getElementById('startBtn').addEventListener('click', function () {
            if (window.LoveMusic) LoveMusic.play();
            loveGo('index2.html');
        });
    })();
</script>
