<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#FAF6F2">
    <title>我们在一起多久了 · 我们的故事</title>
    <meta name="description" content="从 2021.10.10 到今天，每一天都在算。">
    <meta property="og:type" content="website">
    <meta property="og:title" content="我们在一起多久了">
    <meta property="og:description" content="两个日子，都是 10 月 10 日。">
    <meta property="og:image" content="https://alex10200.github.io/public/years/2021-1.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@hanzi.pro/webfonts-lxgw-wenkai@0.1.0/swap.css">
    <link rel="stylesheet" href="./jscss/love.css">
    <script src="./jscss/page.js"></script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Cpath%20d='M16%2028C16%2028%203%2019%203%2011.5%203%207.4%206.1%205%209.3%205%2012.2%205%2014.6%206.8%2016%209.3%2017.4%206.8%2019.8%205%2022.7%205%2025.9%205%2029%207.4%2029%2011.5%2029%2019%2016%2028%2016%2028Z'%20fill='%23C9A9A6'/%3E%3C/svg%3E">
</head>
<body class="page-timer">
<div class="cover-glow"></div>
<div class="petals" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

<div class="wrap">
    <div class="timer-page">
        <p class="sub" id="since">SINCE 2021 . 10 . 10</p>
        <div class="hr"></div>
        <h2 id="title">薇薇，我们已经在一起了</h2>

        <div class="tcard rise">
            <div class="t-label">在 一 起</div>
            <div class="t-since" id="since1">2021 . 10 . 10</div>
            <div class="t-main"><span id="d1">0</span><small>天</small></div>
            <div class="t-sub"><b id="h1">00</b> 时 <b id="m1">00</b> 分 <b id="s1">00</b> 秒</div>
        </div>

        <div class="tcard rise">
            <div class="t-label">已 结 婚</div>
            <div class="t-since" id="since2">2023 . 10 . 10</div>
            <div class="t-main"><span id="d2">0</span><small>天</small></div>
            <div class="t-sub"><b id="h2">00</b> 时 <b id="m2">00</b> 分 <b id="s2">00</b> 秒</div>
        </div>

        <div class="sign rise">
            两个日子，都是 10 月 10 日。<br>往后的每一天，也想和你一起算。
            <span class="name" id="signName">- DaYuan</span>
        </div>

        <button class="btn btn-ghost rise" id="backBtn">再 看 一 遍</button>
    </div>
</div>

<script src="./jscss/data.js"></script>
<script>
    (function () {
        var C = window.LOVE_CONFIG || {};
        var a = String(C.anniversary || '2021-10-10');
        var w = String(C.wedding || '');

        function parse(s) {
            var p = s.split('-');
            return new Date(+p[0], +p[1] - 1, +p[2]);
        }
        function fmt(s) { return s.replace(/-/g, ' . '); }

        document.getElementById('since').textContent = 'SINCE ' + fmt(a);
        document.getElementById('since1').textContent = fmt(a);
        document.getElementById('since2').textContent = w ? fmt(w) : '待填';
        if (C.nickname) document.getElementById('title').textContent = C.nickname + '，我们已经在一起了';
        if (C.signature) document.getElementById('signName').textContent = '- ' + C.signature;

        var startA = parse(a);
        var startW = w ? parse(w) : null;

        var cache = {};
        function set(id, v) {
            if (cache[id] === v) return;
            cache[id] = v;
            document.getElementById(id).textContent = v;
        }
        function pad(n) { return n < 10 ? '0' + n : '' + n; }

        function tick(start, p) {
            var t = Date.now() - start.getTime();
            var d = Math.floor(t / 86400000);
            set('d' + p, d);
            set('h' + p, pad(Math.floor(t / 3600000) % 24));
            set('m' + p, pad(Math.floor(t / 60000) % 60));
            set('s' + p, pad(Math.floor(t / 1000) % 60));
        }

        function loop() {
            tick(startA, 1);
            if (startW) tick(startW, 2);
        }
        loop();
        setInterval(loop, 1000);

        document.getElementById('backBtn').addEventListener('click', function () { loveGo('2021.html'); });

        var els = document.querySelectorAll('.rise');
        requestAnimationFrame(function () {
            for (var i = 0; i < els.length; i++) {
                (function (el, d) { setTimeout(function () { el.classList.add('in'); }, d); })(els[i], 100 + i * 130);
            }
        });
    })();
</script>
</body>
</html>
