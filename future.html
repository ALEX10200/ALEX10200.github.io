<body data-year="2026" data-effect="dust">
<canvas id="fxLayer"></canvas>

<div class="wrap">
    <div class="future">
        <p class="sub rise" id="fuLabel">往 后 余 生</p>
        <div class="hr"></div>
        <h2 class="rise" id="fuTitle">还有很多年</h2>
        <p class="future-text rise" id="fuText"></p>
        <p class="future-poem rise" id="fuPoem"></p>

        <!-- 印章式落款 -->
        <div class="seal rise"><span id="fuSealName">大原</span></div>

        <button class="btn rise" id="toTimer">还 有 一 件 事</button>
    </div>
</div>

<script src="./jscss/data.js"></script>
<script src="./jscss/effects.js"></script>
<script>
    (function () {
        var C = window.LOVE_CONFIG || {};
        var F = C.future || {};

        function set(id, v) { var el = document.getElementById(id); if (el && v) el.textContent = v; }
        set('fuLabel', F.label);
        set('fuTitle', F.title);
        set('fuText', F.text);
        set('fuPoem', F.poem);
        set('fuSealName', F.seal || C.boy);

        var els = document.querySelectorAll('.rise');
        requestAnimationFrame(function () {
            for (var i = 0; i < els.length; i++) {
                (function (el, d) { setTimeout(function () { el.classList.add('in'); }, d); })(els[i], 120 + i * 130);
            }
        });

        document.getElementById('toTimer').addEventListener('click', function () {
            loveGo('index3.html');
        });
    })();
</script>
</body>
